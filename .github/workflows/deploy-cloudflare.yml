name: Deploy to Cloudflare Containers

# Every push to main runs the tests and, when they pass, deploys the
# dashboard + mobile API container to Cloudflare. No secret lives in the repo:
# everything comes from GitHub repository secrets (see docs/CLOUDFLARE-DEPLOY.md).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test tests/HyundaiStock.Tests/HyundaiStock.Tests.csproj -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - name: Type-check Worker
        working-directory: deploy/cloudflare
        run: npm ci && npx tsc --noEmit -p .
      - name: Build container image
        run: docker build -t hyundai-stock:ci .

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Cloudflare secrets
        id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB: ${{ secrets.HYUNDAI_DB_CONNECTION_STRING }}
          JWT: ${{ secrets.HYUNDAI_JWT_KEY }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$DB" ] || [ -z "$JWT" ]; then
            echo "::warning::Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, HYUNDAI_DB_CONNECTION_STRING and HYUNDAI_JWT_KEY repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - name: Install Worker dependencies
        if: steps.guard.outputs.ready == 'true'
        working-directory: deploy/cloudflare
        run: npm ci
      - name: Deploy Worker + container
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare
          packageManager: npm
          command: deploy
          # Runtime secrets are pushed to the Worker on every deploy, then passed
          # to the container as environment variables by src/index.ts.
          secrets: |
            DB_CONNECTION_STRING
            JWT_KEY
            SEED_ADMIN_NAME
            SEED_ADMIN_PHONE
            SEED_ADMIN_PASSWORD
            FCM_SERVER_KEY
            FCM_SERVICE_ACCOUNT_JSON
        env:
          DB_CONNECTION_STRING: ${{ secrets.HYUNDAI_DB_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.HYUNDAI_JWT_KEY }}
          SEED_ADMIN_NAME: ${{ secrets.HYUNDAI_SEED_ADMIN_NAME }}
          SEED_ADMIN_PHONE: ${{ secrets.HYUNDAI_SEED_ADMIN_PHONE }}
          SEED_ADMIN_PASSWORD: ${{ secrets.HYUNDAI_SEED_ADMIN_PASSWORD }}
          FCM_SERVER_KEY: ${{ secrets.HYUNDAI_FCM_SERVER_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.HYUNDAI_FCM_SERVICE_ACCOUNT_JSON }}
